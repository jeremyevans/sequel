name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    services:
      postgres:
        image: postgres:latest
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sequel_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sequel_test
        ports: ["3307:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, ruby: "2.0.0" }
          - { os: ubuntu-24.04, ruby: 2.1 }
          - { os: ubuntu-24.04, ruby: 2.3 }
          - { os: ubuntu-24.04, ruby: 2.4 }
          - { os: ubuntu-24.04, ruby: 2.5 }
          - { os: ubuntu-24.04, ruby: 2.6 }
          - { os: ubuntu-24.04, ruby: 2.7 }
          - { os: ubuntu-24.04, ruby: "3.0" }
          - { os: ubuntu-24.04, ruby: 3.1 }
          - { os: ubuntu-26.04, ruby: 3.2 }
          - { os: ubuntu-26.04, ruby: 3.3 }
          - { os: ubuntu-26.04, ruby: 3.4 }
          - { os: ubuntu-26.04, ruby: "4.0" }
          - { os: ubuntu-24.04, ruby: jruby-9.3 }
          - { os: ubuntu-26.04, ruby: jruby-9.4 }
          - { os: ubuntu-26.04, ruby: jruby-10.0 }
          - { os: ubuntu-26.04, ruby: jruby-10.1 }
          - { os: ubuntu-26.04, ruby: truffleruby }
          - { os: ubuntu-22.04, ruby: jruby-9.2 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.ruby }}
    env:
      BUNDLE_GEMFILE: .ci.gemfile
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get -yqq install libpq-dev libmysqlclient-dev libsqlite3-dev
    - run: sudo apt-get -yqq install libxml2-dev libxslt-dev
      if: startsWith(matrix.ruby, 'truffleruby')
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake spec_ci
      continue-on-error: ${{ startsWith(matrix.ruby, 'truffleruby') }}
